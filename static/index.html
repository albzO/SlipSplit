<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小票 OCR 对比</title>
<style>
:root{--bg:#f6f6f3;--panel:#fff;--ink:#1d1f21;--muted:#6b6f73;--line:#e2e1dc;--accent:#0f766e;--good:#15803d;--bad:#b91c1c;--warn:#a16207;--soft:#eef5f3}
@media (prefers-color-scheme:dark){:root{--bg:#141517;--panel:#1d1f22;--ink:#e8e8e6;--muted:#9a9ea3;--line:#303338;--accent:#2dd4bf;--good:#4ade80;--bad:#f87171;--warn:#facc15;--soft:#1c2c2a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
header{padding:14px 24px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
h1{font-size:17px;margin:0}
header span{color:var(--muted);font-size:13px}
main{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px;padding:18px 24px;max-width:1700px;margin:auto}
@media (max-width:900px){main{grid-template-columns:1fr;padding:14px 16px}}
aside,.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px}
aside{padding:14px;align-self:start}
h2{font-size:12px;letter-spacing:.04em;color:var(--muted);margin:16px 0 8px;font-weight:600}
h2:first-child{margin-top:0}
label.engine{display:flex;gap:8px;padding:4px 0;cursor:pointer;align-items:baseline}
label.engine small{color:var(--muted);margin-left:auto;white-space:nowrap}
.drop{border:1.5px dashed var(--line);border-radius:6px;padding:14px;text-align:center;color:var(--muted);cursor:pointer}
.drop.over,.drop:hover{border-color:var(--accent);color:var(--accent)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.thumbs button{padding:0;border:2px solid transparent;border-radius:5px;background:none;cursor:pointer;height:64px;overflow:hidden}
.thumbs button.on{border-color:var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
input[type=text],input[type=number]{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);font:inherit}
.btn{display:block;width:100%;padding:8px;margin-top:8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit;cursor:pointer}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
@media (prefers-color-scheme:dark){.btn.main{color:#06211e}}
.btn:disabled{opacity:.5;cursor:default}
#status{color:var(--muted);font-size:13px;margin-top:8px;min-height:20px}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--muted);font-weight:600}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
.note{padding:8px 12px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px;margin-top:14px}
@media (max-width:520px){.cards{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:0}
.card>header{padding:9px 12px;display:block;background:none}
.card h3{margin:0;font-size:14px}
.card .mobile{font-size:12px;color:var(--muted)}
.metrics{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 9px}
.tag{font-size:12px;padding:1px 7px;border-radius:4px;background:var(--soft)}
.tag.good{color:var(--good)}.tag.bad{color:var(--bad)}
.body{display:grid;grid-template-columns:150px minmax(0,1fr);border-top:1px solid var(--line)}
.preview{position:relative;align-self:start;border-right:1px solid var(--line)}
.preview img{display:block;width:100%}
.preview svg{position:absolute;inset:0;width:100%;height:100%}
.preview rect{fill:none;stroke:var(--accent);stroke-width:1.5;vector-effect:non-scaling-stroke}
.detail{min-width:0;padding:8px 10px}
.detail table th,.detail table td{padding:3px 5px}
.detail td:first-child{white-space:normal;word-break:break-word}
.bill{margin-top:6px;font-size:13px;display:grid;grid-template-columns:1fr auto;gap:0 12px}
.bill div:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
details{margin-top:8px}
summary{cursor:pointer;color:var(--muted);font-size:12.5px}
pre{white-space:pre-wrap;word-break:break-word;font:12px/1.45 Consolas,"Microsoft YaHei",monospace;max-height:260px;overflow:auto;margin:6px 0 0}
.error{padding:12px;color:var(--bad);word-break:break-word}
.waiting{padding:18px 12px;color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header><h1>小票 OCR 对比</h1><span>同一张小票，同一套解析规则，看哪个模型最适合分账。所有耗时均为电脑 CPU 结果。</span></header>
<main>
<aside>
  <h2>小票图片</h2>
  <div class="drop" id="drop">拖入或点击上传小票<input type="file" id="file" accept="image/*" multiple hidden></div>
  <div class="thumbs" id="thumbs"></div>
  <h2>模型</h2>
  <div id="engines"></div>
  <h2>实际总额（可选，上传的图片用）</h2>
  <input type="number" id="trueTotal" step="any" placeholder="用于判断总额是否读对">
  <button class="btn main" id="runOne">识别当前图片</button>
  <button class="btn" id="runAll">跑全部图片</button>
  <div id="status"></div>
</aside>
<section>
  <div class="panel table-wrap"><table id="board"></table>
    <div class="note">“求和对得上”不需要标注：菜品价格之和与小票总额一致时算通过，这是 App 里判断能否免人工校对的依据。首次运行的下载和加载时间单独列出，不计入平均耗时。</div>
  </div>
  <div class="cards" id="cards"></div>
</section>
</main>
<script>
const $ = id => document.getElementById(id);
const state = {engines: [], images: [], current: null, results: {}, busy: false};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = v => v == null ? '—' : Number(v).toLocaleString('en-US', {maximumFractionDigits: 2});
const secs = ms => ms == null ? '—' : ms < 1000 ? ms + ' ms' : (ms / 1000).toFixed(ms < 10000 ? 2 : 1) + ' s';
const pct = (a, b) => b ? Math.round(100 * a / b) + '%' : '—';
const selected = () => state.engines.filter(e => $('e_' + e.id).checked);
const result = (image, engine) => (state.results[image] || {})[engine];

async function init() {
  const config = await (await fetch('/api/config')).json();
  state.engines = config.engines;
  state.images = config.samples;
  state.current = state.images[0]?.id;
  $('engines').innerHTML = state.engines.map(e => `<label class="engine">
    <input type="checkbox" id="e_${e.id}" ${e.id === 'vl' ? '' : 'checked'}>${esc(e.name)}<small>${esc(e.kind)}</small></label>`).join('');
  render();
}

function render() {
  $('thumbs').innerHTML = state.images.map((img, i) =>
    `<button class="${img.id === state.current ? 'on' : ''}" data-i="${i}" title="${esc(img.name)}"><img src="${img.url}" alt="${esc(img.name)}"></button>`).join('');
  renderBoard();
  renderCards();
}

function renderBoard() {
  const rows = state.engines.map(engine => {
    const done = Object.values(state.results).map(r => r[engine.id]).filter(r => r && r.ok);
    const failed = Object.values(state.results).filter(r => r[engine.id] && r[engine.id].ok === false).length;
    if (!done.length && !failed) return null;
    const avg = done.length ? done.reduce((n, r) => n + r.infer_ms, 0) / done.length : null;
    const load = Math.max(0, ...done.map(r => r.load_ms || 0));
    const scored = done.filter(r => r.score?.total_ok != null);
    const f1s = done.filter(r => r.score?.item_f1 != null);
    const size = done.find(r => r.model_mb != null)?.model_mb;
    return `<tr><td>${esc(engine.name)}</td><td>${done.length}${failed ? ` <span style="color:var(--bad)">+${failed} 失败</span>` : ''}</td>
      <td>${avg == null ? '—' : secs(Math.round(avg))}</td><td>${load ? secs(load) : '—'}</td>
      <td>${size == null ? '—' : size + ' MB'}</td>
      <td>${pct(scored.filter(r => r.score.total_ok).length, scored.length)}</td>
      <td>${f1s.length ? (f1s.reduce((n, r) => n + r.score.item_f1, 0) / f1s.length).toFixed(2) : '—'}</td>
      <td>${pct(done.filter(r => r.sum_ok).length, done.length)}</td></tr>`;
  }).filter(Boolean);
  $('board').innerHTML = rows.length
    ? `<thead><tr><th>模型</th><th>图片数</th><th>平均耗时</th><th>加载耗时</th><th>模型体积</th><th>总额正确率</th><th>菜品 F1</th><th>求和对得上</th></tr></thead><tbody>${rows.join('')}</tbody>`
    : '<tbody><tr><td class="empty">选好图片和模型后开始识别，第一次会自动下载模型</td></tr></tbody>';
}

function renderCards() {
  const image = state.images.find(i => i.id === state.current);
  if (!image) { $('cards').innerHTML = ''; return; }
  $('cards').innerHTML = state.engines.map(e => {
    const r = result(image.id, e.id);
    return r === undefined ? '' : card(e, r, image);
  }).join('');
}

function card(engine, r, image) {
  const head = `<header><h3>${esc(engine.name)}</h3><div class="mobile">${esc(engine.mobile)}</div></header>`;
  if (r === 'running') return `<article class="card">${head}<div class="waiting">识别中…</div></article>`;
  if (!r.ok) return `<article class="card">${head}<div class="error">${esc(r.error)}</div></article>`;
  const boxes = r.lines.filter(l => l.box).map(l =>
    `<rect x="${l.box[0]}" y="${l.box[1]}" width="${l.box[2] - l.box[0]}" height="${l.box[3] - l.box[1]}"/>`).join('');
  const bill = r.receipt;
  const items = bill.items.map(i => `<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.price)}</td></tr>`).join('');
  const extra = [['小计', bill.subtotal], ['税', bill.tax], ['服务费', bill.service], ['优惠', bill.discount], ['总额', bill.total]]
    .filter(([, v]) => v != null).map(([k, v]) => `<div>${k}</div><div>${money(v)}</div>`).join('');
  const tags = [`<span class="tag">${secs(r.infer_ms)}${r.upstream_ms ? `（含 OCR ${secs(r.upstream_ms)}）` : ''}</span>`];
  tags.push(`<span class="tag ${r.sum_ok ? 'good' : 'bad'}">求和${r.sum_ok ? '对得上' : '对不上'}</span>`);
  if (r.score?.total_ok != null) tags.push(`<span class="tag ${r.score.total_ok ? 'good' : 'bad'}">总额${r.score.total_ok ? '正确' : '错误'}</span>`);
  if (r.score?.items_expected != null) tags.push(`<span class="tag">菜品 ${r.score.items_matched}/${r.score.items_expected}</span>`);
  return `<article class="card">${head}<div class="metrics">${tags.join('')}</div><div class="body">
    <div class="preview"><img src="${image.url}" alt=""><svg viewBox="0 0 ${image.width} ${image.height}" preserveAspectRatio="none">${boxes}</svg></div>
    <div class="detail">
      ${items ? `<table><thead><tr><th>菜品</th><th>数量</th><th>金额</th></tr></thead><tbody>${items}</tbody></table>` : '<div class="mobile">没有解析出菜品</div>'}
      <div class="bill">${extra}</div>
      <details><summary>原始输出</summary><pre>${esc(r.raw_text)}</pre></details>
    </div></div></article>`;
}

async function runOn(images) {
  if (state.busy) return;
  const engines = selected();
  if (!engines.length) { $('status').textContent = '请至少选择一个模型'; return; }
  state.busy = true;
  $('runOne').disabled = $('runAll').disabled = true;
  const total = images.length * engines.length;
  let done = 0;
  const trueTotal = $('trueTotal').value === '' ? null : Number($('trueTotal').value);
  for (const image of images) {
    state.results[image.id] ||= {};
    for (const engine of engines) {
      $('status').textContent = `${++done}/${total}：${engine.name} · ${image.name}`;
      state.results[image.id][engine.id] = 'running';
      if (image.id === state.current) renderCards();
      try {
        const response = await fetch('/api/infer', {method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({image: image.id, engine: engine.id, true_total: trueTotal})});
        state.results[image.id][engine.id] = response.ok ? await response.json() : {ok: false, error: `HTTP ${response.status}`};
      } catch (err) {
        state.results[image.id][engine.id] = {ok: false, error: String(err)};
      }
      renderBoard();
      if (image.id === state.current) renderCards();
    }
  }
  state.busy = false;
  $('runOne').disabled = $('runAll').disabled = false;
  $('status').textContent = '完成';
}

async function addFiles(files) {
  for (const file of files) {
    const form = new FormData();
    form.append('file', file);
    const response = await fetch('/api/upload', {method: 'POST', body: form});
    if (!response.ok) { $('status').textContent = `${file.name} 不是有效图片`; continue; }
    const image = await response.json();
    state.images.unshift(image);
    state.current = image.id;
  }
  render();
}

$('runOne').onclick = () => runOn(state.images.filter(i => i.id === state.current));
$('runAll').onclick = () => runOn(state.images);
$('thumbs').onclick = e => {
  const button = e.target.closest('button');
  if (button) { state.current = state.images[button.dataset.i].id; render(); }
};
$('drop').onclick = () => $('file').click();
$('file').onchange = e => addFiles(e.target.files);
$('drop').ondragover = e => { e.preventDefault(); $('drop').classList.add('over'); };
$('drop').ondragleave = () => $('drop').classList.remove('over');
$('drop').ondrop = e => { e.preventDefault(); $('drop').classList.remove('over'); addFiles(e.dataTransfer.files); };
init();
</script>
</body>
</html>
